<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google tag (gtag.js) - GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2V4SR99N5C"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2V4SR99N5C');
  </script>

  <title>ページが見つかりません | AI GeoLens</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .notfound-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .notfound-box { max-width: 500px; }
    .notfound-box .code { font-size: 96px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 16px; }
    .notfound-box h1 { font-size: 24px; margin-bottom: 12px; }
    .notfound-box p { color: var(--text-soft); margin-bottom: 24px; line-height: 1.8; }
    .notfound-box .btn {
      display: inline-block;
      background: var(--gradient);
      color: #fff;
      padding: 14px 32px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="notfound-page">
  <div class="notfound-box">
    <div class="code">404</div>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは存在しないか、移動された可能性があります。<br>URLをご確認の上、ホームページへお戻りください。</p>
    <a href="/" class="btn">ホームに戻る</a>
  </div>
</div>

</body>
</html>
