<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Mesh glow -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)"/>
  
  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Magnifying glass icon -->
  <g transform="translate(490, 180)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="50" cy="50" r="42" fill="url(#accent)" opacity="0.08"/>
    <line x1="82" y1="82" x2="105" y2="105" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <!-- AI circuit dots inside lens -->
    <circle cx="35" cy="40" r="3" fill="#818CF8" opacity="0.6"/>
    <circle cx="55" cy="35" r="2.5" fill="#C084FC" opacity="0.6"/>
    <circle cx="62" cy="55" r="3" fill="#818CF8" opacity="0.5"/>
    <circle cx="40" cy="62" r="2" fill="#C084FC" opacity="0.5"/>
    <line x1="35" y1="40" x2="55" y2="35" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
    <line x1="55" y1="35" x2="62" y2="55" stroke="#C084FC" stroke-width="1" opacity="0.3"/>
    <line x1="62" y1="55" x2="40" y2="62" stroke="#818CF8" stroke-width="1" opacity="0.3"/>
    <line x1="40" y1="62" x2="35" y2="40" stroke="#C084FC" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Brand name -->
  <text x="600" y="370" font-family="Noto Sans JP, sans-serif" font-size="64" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-1">AI GeoLens</text>
  
  <!-- Subtitle -->
  <text x="600" y="420" font-family="Noto Sans JP, sans-serif" font-size="28" font-weight="400" fill="#A5B4FC" text-anchor="middle" letter-spacing="2">GEO診断・AI検索可視性最適化プラットフォーム</text>
  
  <!-- Feature pills -->
  <g transform="translate(600, 480)">
    <rect x="-280" y="-20" width="160" height="40" rx="20" fill="rgba(129,140,248,0.15)" stroke="rgba(129,140,248,0.3)" stroke-width="1"/>
    <text x="-200" y="6" font-family="Noto Sans JP, sans-serif" font-size="15" fill="#C7D2FE" text-anchor="middle">25+ GEO因子分析</text>
    
    <rect x="-100" y="-20" width="160" height="40" rx="20" fill="rgba(192,132,252,0.15)" stroke="rgba(192,132,252,0.3)" stroke-width="1"/>
    <text x="-20" y="6" font-family="Noto Sans JP, sans-serif" font-size="15" fill="#DDD6FE" text-anchor="middle">DeepSeek AI搭載</text>
    
    <rect x="80" y="-20" width="200" height="40" rx="20" fill="rgba(129,140,248,0.15)" stroke="rgba(129,140,248,0.3)" stroke-width="1"/>
    <text x="180" y="6" font-family="Noto Sans JP, sans-serif" font-size="15" fill="#C7D2FE" text-anchor="middle">ChatGPT・Perplexity対応</text>
  </g>
  
  <!-- URL -->
  <text x="600" y="560" font-family="monospace" font-size="18" fill="#64748B" text-anchor="middle">aigeolens.com</text>
</svg>
