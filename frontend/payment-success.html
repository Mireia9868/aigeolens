<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>決済完了 | AI GeoLens</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="payment-page">
  <div class="payment-card" id="payment-card">
    <!-- Content will be dynamically inserted -->
  </div>
</div>

<script>
const API_BASE = window.location.origin;

// Get session_id from URL params
const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session_id");

async function verifyAndGenerateReport() {
  const card = document.getElementById("payment-card");

  if (!sessionId) {
    card.innerHTML = `
      <div class="payment-icon">\u274c</div>
      <h2>エラーが発生しました</h2>
      <p>セッションIDが見つかりません。サポートにお問い合わせください。</p>
      <a href="/" style="display:inline-block;background:var(--primary);color:#fff;padding:14px 32px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:16px;">ホームに戻る</a>
    `;
    return;
  }

  // Show loading state
  card.innerHTML = `
    <div class="payment-spinner"></div>
    <h2>決済を確認中...</h2>
    <p>お支払いを確認し、GEO診断レポートを生成しています。<br>この処理には1〜2分かかる場合があります。</p>
  `;

  try {
    const resp = await fetch(`${API_BASE}/api/verify-payment`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId }),
    });

    const data = await resp.json();

    if (data.error) {
      throw new Error(data.message || data.error);
    }

    // Payment verified — redirect to main page with report data
    // Store report data in sessionStorage and redirect
    sessionStorage.setItem("geo_report_data", JSON.stringify(data));
    window.location.href = "/?report=1";
  } catch (err) {
    card.innerHTML = `
      <div class="payment-icon">\u274c</div>
      <h2>エラーが発生しました</h2>
      <p>${err.message}</p>
      <p style="margin-top:16px;font-size:13px;color:var(--text-light);">決済が完了している場合は、サポートまでお問い合わせください。</p>
      <a href="/" style="display:inline-block;background:var(--primary);color:#fff;padding:14px 32px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:20px;">ホームに戻る</a>
    `;
  }
}

// Check if returning with report data on main page
if (window.location.pathname === "/" && new URLSearchParams(window.location.search).get("report") === "1") {
  const reportData = sessionStorage.getItem("geo_report_data");
  if (reportData) {
    sessionStorage.removeItem("geo_report_data");
    // Render report on main page
    window.addEventListener("DOMContentLoaded", () => {
      try {
        const data = JSON.parse(reportData);
        if (typeof renderFullReport === "function") {
          renderFullReport(data);
        }
      } catch (e) {
        console.error("Failed to render report:", e);
      }
    });
  }
} else {
  // On payment-success page — verify and generate
  verifyAndGenerateReport();
}
</script>

</body>
</html>
